# Hugo configuration file
title: hibi.is Documentation

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Use Cases
      pageRef: /use-cases
      weight: 2
    - name: API Reference
      pageRef: /api
      weight: 3
    - name: FAQ
      pageRef: /faq
      weight: 4
    - name: About
      pageRef: /about
      weight: 5
    - name: Search
      weight: 6
      params:
        type: search
    - name: GitHub
      weight: 7
      url: "https://github.com/guillaumemorin/hibi"
      params:
        icon: github

params:
  description: "Complete documentation for hibi.is - your comprehensive guide to all features and use cases"
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/guillaumemorin/smn/edit/main/content"
